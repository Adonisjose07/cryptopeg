services:
  crypto-core-node:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-1.0.0}
    image: crypto-core-node:latest
    container_name: crypto-dev-node
    restart: unless-stopped
    ports:
      - "${NODE_PORT:-8080}:8080"
    environment:
      - NODE_ENV=development
      - NODE_PORT=${NODE_PORT:-8080}
      - BUILD_VERSION=${BUILD_VERSION:-1.0.0}
      - ENABLE_ORACLE=${ENABLE_ORACLE:-false}
      - ORACLE_POLL_INTERVAL_MS=${ORACLE_POLL_INTERVAL_MS:-5000}
      - NODE_DAEMON_URL=${NODE_DAEMON_URL:-http://127.0.0.1:8080}
      - USDT_VAULT_ADDRESS=${USDT_VAULT_ADDRESS:-0x511A31987EF1019a41CBba658935515Dd64d2D18}
      - ARBITRUM_USDT_ADDRESS=${ARBITRUM_USDT_ADDRESS:-0x900A96C51aac4EB8aF5FDa39bc0Ef13ADBe88B44}
      - ARBITRUM_SEPOLIA_RPC_URL=${ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      - ARBITRUM_RPC_URL=${ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      - TREASURY_WALLET_ADDRESS=${TREASURY_WALLET_ADDRESS:-0x9d59867EfE155406f637F028997866f252dcc72c}
      - TESTNET_PRIVATE_KEY=${TESTNET_PRIVATE_KEY:-}
      - DEPOSIT_FEE_BPS=${DEPOSIT_FEE_BPS:-50}
      - WITHDRAW_FEE_BPS=${WITHDRAW_FEE_BPS:-50}
      - TUMBLER_MIN_FRAGMENTS=${TUMBLER_MIN_FRAGMENTS:-5}
      - TUMBLER_MAX_FRAGMENTS=${TUMBLER_MAX_FRAGMENTS:-15}
      - TUMBLER_MIN_HOPS=${TUMBLER_MIN_HOPS:-2}
      - TUMBLER_MAX_HOPS=${TUMBLER_MAX_HOPS:-4}
      - TUMBLER_POISSON_MEAN_DELAY_MS=${TUMBLER_POISSON_MEAN_DELAY_MS:-250}
      - CRYPTO_DATA_DIR=${CRYPTO_DATA_DIR:-/app/data/lmdb}
      - NODE_ID=${NODE_ID:-}
      - P2P_LISTEN_URL=${P2P_LISTEN_URL:-}
      - P2P_SEED_PEERS=${P2P_SEED_PEERS:-}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    stdin_open: true
    tty: true
