name: CryptoPeg CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cpp-tests:
    name: C++ Build and Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libsodium-dev \
            libssl-dev \
            liblmdb-dev \
            nlohmann-json3-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          cmake --build build --parallel 2

      - name: Run complete C++ unit test suite
        shell: bash
        run: |
          set +e
          status=0
          tests=(
            test_vault_precision
            test_stealth_privacy
            test_tumbler_mixer
            test_lmdb_persistence
            test_rpc_api
            test_mnemonic_wallet
            test_p2p_network
            test_crypto_primitives
          )
          for test_name in "${tests[@]}"; do
            echo "============================================================"
            echo "Running ${test_name}"
            echo "============================================================"
            "./build/bin/${test_name}"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error title=${test_name} failed::Exit code ${rc}"
              status=1
            fi
          done
          exit $status

  solidity-tests:
    name: Smart Contracts and Oracle Tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run unit tests
        run: npm test
